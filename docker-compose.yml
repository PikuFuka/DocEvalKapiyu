
services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: thesis_db
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thesis_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thesis_backend
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      # Mount source code for development (hot reload)
      - ./backend:/app
      # IMPORTANT: Exclude venom (local venv) by using anonymous volume
      - /app/venom
      # Persist media files
      - backend_media:/app/media
      # Mount ML models (so they persist and aren't rebuilt)
      - ./backend/api/ml_models:/app/api/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - thesis_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thesis_frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for development (hot reload)
      - ./frontend:/app
      # IMPORTANT: Exclude node_modules by using anonymous volume
      # This prevents local node_modules from overwriting container's
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    networks:
      - thesis_network

volumes:
  postgres_data:
  backend_media:

networks:
  thesis_network:
    driver: bridge